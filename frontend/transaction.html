<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Simulado - Playwright Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        nav {
            margin-bottom: 20px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            margin: 0 10px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            transition: background 0.3s;
        }

        nav a:hover {
            background: rgba(0, 0, 0, 0.4);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #fda085;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .col {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: #ff758c;
            color: white;
            margin-top: 10px;
        }

        button:hover {
            background: #ff5e78;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
        }

        .success-message {
            display: none;
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            text-align: center;
        }

        .success-message.show {
            display: block;
        }
        
        .error-message {
            display: none;
            background: #f44336;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            text-align: center;
        }
        
        .error-message.show {
            display: block;
        }
    </style>
</head>

<body>
    <nav>
        <a href="index.html">Registro</a>
        <a href="transaction.html">Pago Simulado</a>
    </nav>

    <div class="container">
        <h1>Pago Simulado</h1>
        <p class="subtitle">Complete los datos de la tarjeta para continuar</p>

        <form id="paymentForm">
            <div class="form-group">
                <label for="amount">Monto a pagar (USD)</label>
                <input type="number" id="amount" name="amount" placeholder="Ej: 100.00" step="0.01" min="1" required>
            </div>

            <div class="form-group">
                <label for="cardNumber">Número de Tarjeta</label>
                <input type="text" id="cardNumber" name="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" required>
            </div>

            <div class="row">
                <div class="col">
                    <div class="form-group">
                        <label for="expiry">Vencimiento (MM/AA)</label>
                        <input type="text" id="expiry" name="expiry" placeholder="MM/AA" maxlength="5" required>
                    </div>
                </div>
                <div class="col">
                    <div class="form-group">
                        <label for="cvv">CVV</label>
                        <input type="text" id="cvv" name="cvv" placeholder="123" maxlength="4" required>
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn">Pagar Ahora</button>

            <div class="success-message" id="successMessage">
                ¡Pago procesado con éxito! ✓
            </div>
            <div class="error-message" id="errorMessage">
                Hubo un error al procesar el pago.
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('paymentForm');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');

            // Formato simple para la tarjeta
            document.getElementById('cardNumber').addEventListener('input', function (e) {
                let value = e.target.value.replace(/\D/g, '');
                value = value.replace(/(\d{4})/g, '$1 ').trim();
                e.target.value = value;
            });
            
            // Formato simple para el vencimiento
            document.getElementById('expiry').addEventListener('input', function (e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length > 2) {
                    value = value.substring(0, 2) + '/' + value.substring(2, 4);
                }
                e.target.value = value;
            });

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                successMessage.classList.remove('show');
                errorMessage.classList.remove('show');

                const amount = document.getElementById('amount').value;
                const cardNumber = document.getElementById('cardNumber').value.replace(/\s/g, '');

                const payload = {
                    amount: amount,
                    cardNumber: cardNumber
                };

                try {
                    const response = await fetch('http://localhost:3000/api/transactions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        successMessage.classList.add('show');
                        form.reset();
                        setTimeout(() => {
                            successMessage.classList.remove('show');
                        }, 5000);
                    } else {
                        throw new Error('Error en el servidor');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    errorMessage.classList.add('show');
                    setTimeout(() => {
                        errorMessage.classList.remove('show');
                    }, 5000);
                }
            });
        });
    </script>
</body>

</html>
